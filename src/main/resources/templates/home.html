<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <title>勤怠管理</title>
</head>
<body>
    <header>
        <div class="header">
            <h1>勤怠管理</h1>
            <p>本日: <span th:text="${#dates.format(#dates.createNow(), 'yyyy/MM/dd HH:mm:ss')}"></span></p>
        </div>

    <div class="button-rightTop">
        <form th:action="@{/logout}">
            <button type="submit">ログアウト</button>
        </form>

        <form th:action="@{/system}" th:method="get" th:object="${user}">
            <!--              th:if="${session.user.branchId == 1 and session.user.departmentId == 1}">-->
            <button type="submit">ユーザー管理</button>
        </form>

        <form th:action="@{/attendance}">
            <button type="submit">勤怠登録</button>
        </form>
    </div>

<span th:text="${year} + '年' + ${month} + '月'"></span>
<a th:href="@{/home(year=${year},month=${month - 1})}"> ＜前月＞</a>
<a th:href="@{/home(year=${year},month=${month + 1})}">＜次月＞ </a>
<p>合計労働時間: <span th:text="${totalWorkingTime}">00:00</span></p>

<table>
    <thead>
    <tr>
        <th>日付</th>
        <th>出社</th>
        <th>退社</th>
        <th>メモ</th>
        <th>労働時間</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="row : ${attendances}" th:if="${row != null}">

    <tr th:each="i : ${#numbers.sequence(1,totalDays)}">
        <td th:text="${#numbers.formatInteger(month,2) + '/' + #numbers.formatInteger(i,2)}"></td>
        <div th:each="row : ${attendances}" th:if="${row != null}">
            <div th:if="${#numbers.formatInteger(i,2) == #strings.substring(row.attendance, 8, 10)}">

                <td th:text="${#strings.substring(row.attendance, 11, 16)}"></td>
                <td th:text="${#strings.substring(row.leave, 11, 16)}"></td>
                <td th:text="${row.comment}"></td>
                <td th:text="${#temporals.format(row.restTime, 'HH:mm')}"></td>

                <td class="button-signup">
                    <form th:action="@{/attendanceedit}" th:method="post">
                        <input type="hidden" th:name="id" th:value="${row.id}">
                        <input type="submit" class="submit-btn2" value="編集"/>
                    </form>
                </td>
            </div>
        </div>
    </tr>

    </tbody>
</table>

<button onclick="setSubmit()">送信</button>


</body>
</html>
