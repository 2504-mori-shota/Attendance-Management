<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <title>勤怠管理</title>
</head>
<body>

<header>
    <h1>勤怠管理</h1>
    <p>本日: <span th:text="${#dates.format(#dates.createNow(), 'yyyy/MM/dd HH:mm:ss')}"></span></p>
</header>

<div class="button-rightTop">
    <form th:action="@{/logout}">
        <button type="submit">ログアウト</button>
    </form>

    <form th:action="@{/system}" th:method="get" th:object="${user}">
        <!--              th:if="${session.user.branchId == 1 and session.user.departmentId == 1}">-->
        <button type="submit">ユーザー管理</button>
    </form>

    <form th:action="@{/attendance}">
        <button type="submit">勤怠登録</button>
    </form>

</div>


<section>
    <h3 th:text="${yer} + '年 ' + ${month} + '月'"></h3>
    <button onclick="onClickMonth(-1)">前月</button>
    <button onclick="onClickMonth(1)">次月</button>
</section>

<table >
    <thead>
    <tr>
        <th>日付</th>
        <th>出社</th>
        <th>退社</th>
        <th>メモ</th>
        <th>労働時間</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="ron : ${attendances}">
        <td th:text="${ron.id}"></td>
        <td th:text="${ron.attendance}"></td>
        <td th:text="${ron.leave}"></td>
        <td th:text="${ron.comment}"></td>
        <td th:text="${ron.stateId}"></td>
    </tr>
    </tbody>
</table>

<button onclick="setSubmit()">送信</button>


</body>
</html>
