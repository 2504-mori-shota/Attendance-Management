<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html">
    <head>
        <meta charset="UTF-8">
        <link th:href="@{/css/style.css}" rel="stylesheet">
        <title>勤怠管理</title>
    </head>
    <body>
        <header>
            <div class="header">
                <h1>勤怠管理</h1>
                <p>本日: <span th:text="${#dates.format(#dates.createNow(), 'yyyy/MM/dd HH:mm:ss')}"></span></p>
                <p>
                     役職 : <span th:text="${session.loginUser.post.postName}"></span><br/>
                    アカウント:　<span th:text="${session.loginUser.account}"></span><br/>
                     氏名 : <span th:text="${session.loginUser.name}"></span>
                </p>

                <div th:if="${errorMessageForm}" class="alert alert-error alert-dismissible fade show" role="alert">
                    <strong th:text="${errorMessageForm}"></strong>
                </div>
            </div>
        </header>

        <div class="button-rightTop">
            <form th:action="@{/logout}">
                <button type="submit" class="delete-btn">ログアウト</button>
            </form>

            <form th:action="@{/system}" th:method="get" th:object="${user}" th:if="${session.loginUser.postId == 3}">
                <button type="submit" class="btn">ユーザー管理</button>
            </form>


            <form th:action="@{/user/edit/id={id}(id=${session.loginUser.id})}">
                <input type="submit" value="アカウント編集" class="btn"/>
            </form>

            <form th:action="@{/request/myself/{id}(id=${session.loginUser.id})}">
                <input type="submit" value="申請状況" class="btn"/>
            </form>

            <form th:action="@{/request/list}" th:method="get" th:if="${session.loginUser.postId == 2}">
                <button type="submit" class="btn">申請一覧</button>
            </form>

            <form th:action="@{request/approval/list}" th:method="get" th:if="${session.loginUser.postId == 2 || session.loginUser.postId == 3}">
                  <button type="submit" class="btn">承認済申請一覧</button>
            </form>

        </div>

        <span th:text="${year} + '年' + ${month} + '月'"></span>
        <a th:href="@{/home(year=${year},month=${month - 1})}"> ＜前月＞</a>
        <a th:href="@{/home(year=${year},month=${month + 1})}">＜次月＞ </a>
        <p>合計労働時間: <span th:text="${totalWorkingTime}">00:00</span></p>

        <table id="scheduleTable" class="list" border="1" style="border-collapse: collapse">
            <thead>
            <tr>
                <th>日付</th>
                <th>出勤</th>
                <th>退勤</th>
                <th>休憩時間</th>
                <th>労働時間</th>
                <th>メモ</th>
                <th>編集</th>
                <th>消去</th>
                <th>ステータス</th>

            </tr>
            </thead>
            <tbody>

            <tr th:each="i, stat: ${dataNumList}" align="center">
                <div th:if="${i == 0}">
                    <td>
                        <a th:href="${'/attendance?date=' + year + '-' + #numbers.formatInteger(month,2) + '-' + #numbers.formatInteger(stat.count,2)}"
                           th:text="${#numbers.formatInteger(month,2) + '/' + #numbers.formatInteger(stat.count,2)}">
                        </a>
                    </td>
                    <td/><td/><td/><td/><td/><td/><td/>
                </div>

                <div th:if="${i ge 1}">
                    <td>
                        <a th:href="${'/attendance?date=' + year + '-' + #numbers.formatInteger(month,2) + '-' + #numbers.formatInteger(stat.count,2)}"
                           th:text="${#numbers.formatInteger(month,2) + '/' + #numbers.formatInteger(stat.count,2)}">
                        </a>
                    </td>
                    <!--ここまでが正常-->
                    <div th:each="row : ${attendances}">
                        <div th:if="${#numbers.formatInteger(stat.count,2) == #strings.substring(row.attendance, 8, 10)}" >
                                <td th:text="${#strings.substring(row.attendance, 11, 16)}"></td>
                                <td th:text="${#strings.substring(row.leave, 11, 16)}"></td>
                                <td th:text="${#temporals.format(row.totalRestTime, 'HH:mm')}"></td><!--合計休憩時間-->
                                <td th:text="${#temporals.format(row.totalWorkRestTime, 'HH:mm')}"></td>
                                 <td th:text="${row.comment}" align="left"></td>
                                <td class="buttons">
                                    <div th:if="${row.state == 0 || row.state == 4 || row.state == 5}">
                                        <form th:action="@{/attendance/edit/id={id}(id=${row.id})}" th:method="get">
                                            <!--<input type="hidden" th:name="id" th:value="${row.id}">-->
                                            <input type="submit" class="submit-btn2 btn" value="編集"/>
                                        </form>
                                    </div>
                                </td>
                                <td class="buttons">
                                    <div th:if="${row.state == 0 || row.state == 4 || row.state == 5}">
                                        <form th:action="@{/attendance/delete/{id}(id=${row.id})}" th:method="post">
                                            <input type="hidden" name="_method" value="delete"/>
                                            <button type="submit" class="delete-btn" onclick="return confirm('消去しますか？');">消去</button>
                                        </form>
                                    </div>
                                </td>
                                <td>
                                    <span th:text="${statuses[row.state]}" />
                                </td>
                        </div>
                    </div>
                </div>
            </tr>

            </tbody>
        </table>

        <form th:action="@{/home/application}" th:method="post" th:object="${attendanceList}">
            <div th:each="item, stat : *{attendances}">
                <input type="hidden" th:field="*{attendances[__${stat.index}__].id}">
                <input type="hidden" th:field="*{attendances[__${stat.index}__].userId}">
                <input type="hidden" th:field="*{attendances[__${stat.index}__].attendance}">
                <input type="hidden" th:field="*{attendances[__${stat.index}__].leave}">
                <input type="hidden" th:field="*{attendances[__${stat.index}__].restStart}">
                <input type="hidden" th:field="*{attendances[__${stat.index}__].restEnd}">
                <input type="hidden" th:field="*{attendances[__${stat.index}__].comment}">
                <input type="hidden" th:field="*{attendances[__${stat.index}__].state}">
                <input type="hidden" th:field="*{attendances[__${stat.index}__].createdDate}">
            </div>
            <input type="submit" value="申請" class="round-button"
                   onclick="return confirm('申請してもよろしいでしょうか？')"/>
            <!---->
        </form>


    </body>
</html>
