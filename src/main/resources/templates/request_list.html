<!DOCTYPE html>
<html xmlns:th="http://www.w3.org/1999/xhtml">
<html lang="en">
<head>
    <meta charset="UTF-8">
    　
    <link th:href="@{/css/style.css}" rel="styleSheet">
    <title>申請一覧</title>
</head>
<body>
<div class="header">
    <h1>申請一覧</h1>
</div>

    <table id="scheduleTable" class="list" border="1" style="border-collapse: collapse">
        <thead>
        <tr>
            <th>ID</th>
            <th>申請者</th>
            <th>期間(開始)</th>
            <th>期間(終了)</th>
            <th>ステータス</th>
            <th>詳細</th>
        </tr>
        </thead>
        <tbody>
        <div th:each="request : ${requests}">
            <div th:if="${request.state == 1 || request.state == 3}">
                <tr>
                    <td><span th:text="${request.id}"/>
                    <td><span th:text="${request.user.name}"/>
                    <td><span th:text="${request.startDate}"/>
                    <td><span th:text="${request.endDate}"/>
                    <td><span th:text="${statuses[request.state]}"/>
                    <td>
                        <form th:action="@{/request/detail/id={id}(id=${request.id})}" th:method="get">
                           <!-- <input type="hidden" name="id" th:value="${request.id}">-->
                            <button type="submit">詳細</button>
                        </form>
                    </td>
                </tr>
            </div>
        </div>
        </tbody>
    </table>
    <form th:action="@{/home}" th:method="get">
        <div>
            <button type="submit" class="submit-btn2">戻る</button>
        </div>
    </form>
</body>
</html>
