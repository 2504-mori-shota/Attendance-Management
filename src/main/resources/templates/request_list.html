<!DOCTYPE html>
<html xmlns:th="http://www.w3.org/1999/xhtml">
<html lang="en">
<head>
    <meta charset="UTF-8">
    　
    <link th:href="@{/css/style.css}" rel="styleSheet">
    <title>申請一覧</title>
</head>
<body>
<h1>申請一覧</h1>

<table id="scheduleTable" class="list" border="1" style="border-collapse: collapse">
    <thead>
    <tr>
        <th>ID</th>
        <th>user</th>
        <th>期間(開始)</th>
        <th>期間(終了)</th>
        <th>状態</th>
        <th>詳細</th>
    </tr>
    </thead>
    <tbody>
    <div th:each="request : ${requests}">
        <tr>
            <td><span th:text="${request.id}"/>
            <td><span th:text="${request.userId}"/>
            <td><span th:text="${request.startDate}"/>
            <td><span th:text="${request.endDate}"/>
            <td><span th:text="${request.state}"/>
            <td>
                <form th:action="@{/request/detail}" th:method="get" th:object="${request}">
                    <input type="hidden" name="id" value="${request.id}">
                    <button type="submit">詳細</button>
                </form>
            </td>
        </tr>
    </div>
    </tbody>
</table>
<form th:action="@{/home}" th:method="get">
    <div>
        <button type="submit" class="submit-btn2">戻る</button>
    </div>
</form>
</body>
</html>
